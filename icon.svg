<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#c7d2fe" stroke-width="1.5"/>

  <g filter="url(#glow)">
    <rect x="24" y="22" width="16" height="18" rx="4" fill="url(#core)"/>
    <rect x="31" y="17" width="6" height="5" rx="2" fill="#8b5cf6"/>
    <circle cx="34" cy="15" r="2.5" fill="#a78bfa"/>
    <rect x="28" y="27" width="3.5" height="4" rx="1.5" fill="#ffffff"/>
    <rect x="32.5" y="27" width="3.5" height="4" rx="1.5" fill="#ffffff"/>
    <rect x="29.5" y="35" width="5" height="2" rx="1" fill="#c7d2fe"/>
  </g>

  <circle cx="11" cy="18" r="4.5" fill="url(#sat)" filter="url(#glow)"/>
  <circle cx="53" cy="18" r="4.5" fill="url(#sat)" filter="url(#glow)"/>
  <circle cx="32" cy="53" r="4.5" fill="url(#sat)" filter="url(#glow)"/>

  <line x1="15" y1="21" x2="28" y2="30" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="49" y1="21" x2="36" y2="30" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="32" y1="48.5" x2="32" y2="41" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round"/>
</svg>
